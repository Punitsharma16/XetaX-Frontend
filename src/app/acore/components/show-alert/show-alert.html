<div aria-labelledby="myModalLabel" [id]="basicSetting.id" class="modal fade show" id="delete_record"
    style="z-index: 1060;" role="dialog" tabindex="-1" aria-modal="true">
    <div class="modal-dialog delete_record" [class.modal-lg]="basicSetting.large" role="document">
        <div class="modal-content">
            <div class="modal-header border-0 pb-0 mb-0">
                <button aria-label="Close" class="btn-close" (click)="onButton2Clicked()" type="button">
                </button>
            </div>
            <div class="modal-body mb-0 p-4">
                <div class="user-form">
                    <div class="input-group">
                        <form class="text-center">
                            <img *ngIf="basicSetting.image" [src]="basicSetting.image" 
                                 class="mb-3" style="max-width: 100px; border-radius: 8px;">
                            <p class="mb-4 text-secondary" style="font-size: 1rem;">{{basicSetting.message}}</p>
                            <div class="d-flex gap-3 justify-content-center">
                                <button type="button" class="btn btn-primary px-4" 
                                        (click)="onButton1Clicked()">
                                    <i class="bi bi-check-circle me-2"></i>Ok
                                </button>
                                <a *ngIf="basicSetting.noButtons" class="btn btn-outline-secondary px-4"  
                                   (click)="onButton2Clicked()" type="button">
                                    <i class="bi bi-x-circle me-2"></i>Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

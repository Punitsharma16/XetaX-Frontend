<div class="sidebar-layout">
  <div class="sidebar-overlay" *ngIf="isMobile && isMobileOpen" (click)="closeMobile()"></div>
  <button class="mobile-toggle d-lg-none" (click)="toggleMobile()">
    <i class="bi" [class.bi-list]="!isMobileOpen" [class.bi-x-lg]="isMobileOpen"></i>
  </button>

  <aside class="sidebar" *ngIf="isServicePage" [class.collapsed]="isCollapsed" [class.mobile-open]="isMobileOpen">
    <div class="d-lg-none text-center py-2" (click)="closeMobile()">
      <div class="d-inline-block rounded-pill" style="width: 40px; height: 4px; background: #cbd5e1;"></div>
    </div>

    <div class="sidebar-brand">
      <div class="brand-logo">
        <i class="bi" [ngClass]="contextIcon || 'bi-grid-fill'"></i>
        <span class="brand-text">{{ contextLabel || 'CRM' }}</span>
      </div>
      <button class="collapse-btn d-none d-lg-flex" (click)="toggleCollapse()" [class.rotated]="isCollapsed">
        <i class="bi bi-chevron-left"></i>
      </button>
    </div>

    <div class="sidebar-user" (click)="goToProfile()" role="button">
      <div class="user-avatar initials-avatar">{{ userInitials }}</div>
      <div class="user-details">
        <div class="user-name">{{ userName || 'User' }}</div>
        <div class="user-email">{{ userEmail || 'No email' }}</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of menu"
         class="nav-item"
         [class.back-item]="item.key === 'back'"
         [routerLink]="item.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.key === 'back' }"
         (click)="closeMobile()">
        <i [class]="'bi ' + item.icon"></i>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="nav-item" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span class="nav-label">Logout</span>
      </a>
    </div>
  </aside>

  <main class="main-content" [class.sidebar-collapsed]="isCollapsed" [class.full-width]="!isServicePage">
    <router-outlet></router-outlet>
  </main>
</div>

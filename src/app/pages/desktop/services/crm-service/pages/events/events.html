<div class="container-fluid px-3 px-md-4 py-3 py-md-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h6 class="mb-0"><i class="bi bi-calendar me-2 text-primary"></i>Events</h6>
    <button class="btn btn-primary btn-sm" (click)="addEvent()"><i class="bi bi-plus-circle me-1"></i>Log Event</button>
  </div>

  <div *ngIf="events.length > 0; else emptyEvents">
    <div *ngFor="let event of events" class="mb-3 fade-in">
      <div class="card">
        <div class="card-body">
          <div class="d-flex gap-3">
            <div class="d-flex align-items-center justify-content-center bg-light rounded-3 flex-shrink-0" style="width: 48px; height: 48px;">
              <i class="bi fs-5 text-primary"
                [class.bi-telephone]="event.eventType === 'CALL'"
                [class.bi-envelope]="event.eventType === 'EMAIL'"
                [class.bi-calendar]="event.eventType === 'MEETING'"
                [class.bi-chat]="event.eventType === 'NOTE'"></i>
            </div>
            <div class="flex-grow-1 min-width-0">
              <div class="d-flex flex-wrap justify-content-between gap-2">
                <h6 class="mb-0">{{event.eventType}}</h6>
                <small class="text-muted">{{event.createAt | date:'medium'}}</small>
              </div>
              <p class="mb-2 mt-1 text-break">{{event.message}}</p>
              <div class="d-flex flex-wrap gap-3 align-items-center">
                <small class="text-muted"><i class="bi bi-person me-1"></i>{{getUserName(event.createBy)}}</small>
                <a *ngIf="event.recordingUrl" [href]="event.recordingUrl" target="_blank" class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-play-circle me-1"></i>Recording
                </a>
                <div class="dropdown ms-auto">
                  <button class="btn btn-sm btn-link text-muted p-0" data-bs-toggle="dropdown">
                    <i class="bi bi-three-dots-vertical"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#" (click)="$event.preventDefault();editEvent(event)"><i class="bi bi-pencil me-2"></i>Edit</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#" (click)="$event.preventDefault();deleteEvent(event.id)"><i class="bi bi-trash me-2"></i>Delete</a></li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-template #emptyEvents>
    <div class="empty-state py-4">
      <i class="bi bi-calendar fs-2"></i>
      <p class="mt-2 mb-0">No events logged</p>
    </div>
  </ng-template>

  <div class="modal fade" [class.show]="showEventForm" [style.display]="showEventForm ? 'block' : 'none'">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{selectedEvent ? 'Edit' : 'Log'}} Event</h5>
          <button type="button" class="btn-close" (click)="closeEventForm()"></button>
        </div>
        <form #eventForm="ngForm" (ngSubmit)="saveEvent()">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label">Event Type</label>
                <select class="form-select" [(ngModel)]="eventModel.eventType" name="eventType">
                  <option value="CALL">Call</option>
                  <option value="EMAIL">Email</option>
                  <option value="MEETING">Meeting</option>
                  <option value="NOTE">Note</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Message <span class="text-danger">*</span></label>
                <textarea class="form-control" rows="3" [(ngModel)]="eventModel.message" name="message" required></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">Recording URL</label>
                <input type="url" class="form-control" [(ngModel)]="eventModel.recordingUrl" name="recordingUrl" placeholder="https://...">
              </div>
            </div>
          </div>
          <div class="modal-footer d-grid d-sm-flex">
            <button type="button" class="btn btn-light" (click)="closeEventForm()">Cancel</button>
            <button type="submit" class="btn btn-primary" [disabled]="eventForm.invalid">
              <i class="bi bi-check-circle me-1"></i>{{selectedEvent ? 'Update' : 'Save'}}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" *ngIf="showEventForm"></div>
</div>

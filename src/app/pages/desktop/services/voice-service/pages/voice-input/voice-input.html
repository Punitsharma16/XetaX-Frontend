<div class="voice-container">
  <div class="voice-card">
    <div class="card-header">
      <i class="bi bi-mic"></i>
      <h2>AI Voice Bot</h2>
      <p class="text-muted">Record audio or upload a file to transcribe, get AI response, and hear it spoken back.</p>
    </div>

    <div class="card-body">
      <div class="record-section">
        <button
          class="record-btn"
          [class.recording]="isRecording"
          [disabled]="isProcessing"
          (click)="toggleRecording()"
        >
          <i class="bi" [class.bi-mic]="!isRecording" [class.bi-mic-fill]="isRecording"></i>
        </button>
        <span class="record-label">
          {{ isRecording ? 'Recording... Click to stop' : 'Click to Record' }}
        </span>
        <span class="recording-indicator" *ngIf="isRecording"></span>
      </div>

      <div class="divider">
        <span>OR</span>
      </div>

      <div class="upload-area">
        <label for="audioFile" class="upload-label">
          <i class="bi bi-cloud-upload"></i>
          <span>{{ selectedFile ? selectedFile.name : 'Choose an audio file (WAV, MP3, etc.)' }}</span>
        </label>
        <input
          type="file"
          id="audioFile"
          accept="audio/*"
          (change)="onFileSelected($event)"
          class="file-input"
        />
      </div>

      <div *ngIf="recordedUrl && !selectedFile" class="recorded-preview">
        <audio controls [src]="recordedUrl" class="audio-player"></audio>
      </div>

      <button
        class="process-btn"
        [disabled]="(!selectedFile && !recordedBlob) || isProcessing"
        (click)="processAudio()"
      >
        <i class="bi" [class.bi-arrow-right-circle]="!isProcessing" [class.bi-arrow-repeat]="isProcessing"></i>
        {{ isProcessing ? 'Processing...' : 'Process Audio' }}
      </button>

      <div *ngIf="error" class="alert alert-error">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
      </div>

      <div *ngIf="result" class="result-section">
        <div class="result-item">
          <label><i class="bi bi-file-text"></i> Transcript</label>
          <p>{{ result.transcript }}</p>
        </div>

        <div class="result-item">
          <label><i class="bi bi-robot"></i> AI Response</label>
          <p>{{ result.aiResponse }}</p>
        </div>

        <div class="result-item" *ngIf="audioUrl">
          <label><i class="bi bi-volume-up"></i> Audio Response</label>
          <div class="audio-controls">
            <audio controls autoplay [src]="audioUrl" class="audio-player"></audio>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card menu-item-card h-100">
  <div class="card-body p-3">
    <div class="d-flex gap-3">
      <div class="menu-item-image flex-shrink-0 d-flex align-items-center justify-content-center bg-light rounded-3" style="width: 72px; height: 72px;">
        <i class="bi bi-image text-muted fs-4" *ngIf="!item.image"></i>
        <img *ngIf="item.image" [src]="item.image" [alt]="item.name" class="rounded-3 w-100 h-100" style="object-fit: cover;">
      </div>
      <div class="min-width-0 flex-grow-1">
        <div class="d-flex align-items-start justify-content-between gap-2">
          <div class="min-width-0">
            <div class="d-flex align-items-center gap-1 mb-1">
              <span class="badge p-1 rounded-1" [class.bg-success]="item.isVeg" [class.bg-danger]="!item.isVeg" style="width: 14px; height: 14px;">
                <i class="bi bi-circle-fill text-white d-block" style="font-size: 6px;"></i>
              </span>
              <h6 class="mb-0 text-truncate small fw-semibold">{{item.name}}</h6>
            </div>
            <p class="text-muted mb-2 small text-truncate" style="max-width: 200px;">{{item.description}}</p>
          </div>
        </div>
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <span class="fw-bold text-primary">₹{{item.price}}</span>
            <span *ngIf="item.preparationTime" class="text-muted small ms-2">
              <i class="bi bi-clock me-1"></i>{{item.preparationTime}} min
            </span>
          </div>
          <div *ngIf="quantity === 0; else quantityControls">
            <button class="btn btn-primary btn-sm px-3" (click)="addToCart.emit(item)" [disabled]="!item.isAvailable">
              <i class="bi bi-plus me-1"></i>Add
            </button>
          </div>
          <ng-template #quantityControls>
            <div class="d-flex align-items-center gap-2 bg-light rounded-3 p-1">
              <button class="btn btn-sm btn-link text-muted p-0 px-1" (click)="decrement.emit(item)">
                <i class="bi bi-dash"></i>
              </button>
              <span class="fw-semibold small">{{quantity}}</span>
              <button class="btn btn-sm btn-link text-muted p-0 px-1" (click)="increment.emit(item)">
                <i class="bi bi-plus"></i>
              </button>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid px-2 px-sm-3 px-md-4 py-2 py-sm-3 py-md-4">
  <div class="d-flex align-items-center gap-3 mb-3">
    <button class="btn btn-sm btn-light" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
    </button>
    <div>
      <h5 class="mb-0">Checkout</h5>
      <small class="text-muted">Review and place your order</small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-7">
      <div class="card mb-3">
        <div class="card-body p-3">
          <h6 class="fw-semibold mb-3 small">
            <i class="bi bi-person me-2 text-primary"></i>Customer Information
          </h6>
          <div class="row g-3">
            <div class="col-12 col-sm-6">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" placeholder="Your name" [(ngModel)]="customerName">
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" placeholder="10-digit mobile number" [(ngModel)]="customerMobile">
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-body p-3">
          <h6 class="fw-semibold mb-3 small">
            <i class="bi bi-credit-card me-2 text-primary"></i>Payment Method
          </h6>
          <div class="d-flex gap-3 flex-wrap">
            <div class="payment-option flex-grow-1" [class.active]="selectedPayment === 'ONLINE'" (click)="selectPayment('ONLINE')">
              <div class="card h-100 cursor-pointer" [class.border-primary]="selectedPayment === 'ONLINE'" [class.bg-light]="selectedPayment !== 'ONLINE'">
                <div class="card-body p-3 text-center">
                  <i class="bi bi-credit-card-2-front fs-3 mb-2 d-block" [class.text-primary]="selectedPayment === 'ONLINE'" [class.text-muted]="selectedPayment !== 'ONLINE'"></i>
                  <small class="fw-semibold d-block">Online Payment</small>
                  <small class="text-muted">Pay with card / netbanking / wallet</small>
                </div>
              </div>
            </div>
            <div class="payment-option flex-grow-1" [class.active]="selectedPayment === 'UPI_QR'" (click)="selectPayment('UPI_QR')">
              <div class="card h-100 cursor-pointer" [class.border-primary]="selectedPayment === 'UPI_QR'" [class.bg-light]="selectedPayment !== 'UPI_QR'">
                <div class="card-body p-3 text-center">
                  <i class="bi bi-qr-code-scan fs-3 mb-2 d-block" [class.text-primary]="selectedPayment === 'UPI_QR'" [class.text-muted]="selectedPayment !== 'UPI_QR'"></i>
                  <small class="fw-semibold d-block">UPI QR</small>
                  <small class="text-muted">Scan & pay with any UPI app</small>
                </div>
              </div>
            </div>
          </div>

          <div *ngIf="selectedPayment === 'UPI_QR'" class="mt-3 text-center p-3 bg-light rounded-3">
            <!-- TODO: Replace with actual uploaded restaurant UPI QR image -->
            <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-3 p-3 mb-2" style="width: 180px; height: 180px;">
              <i class="bi bi-qr-code text-muted" style="font-size: 6rem;"></i>
            </div>
            <p class="small text-muted mb-0">Scan this QR code with any UPI app to pay</p>
            <p class="small text-muted">Amount: <strong class="text-primary">₹{{cartService.grandTotal}}</strong></p>
            <!-- TODO: Restaurant owner should upload their payment QR image here -->
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-body p-3">
          <h6 class="fw-semibold mb-3 small">
            <i class="bi bi-chat-left-text me-2 text-primary"></i>Order Notes
          </h6>
          <textarea class="form-control" rows="2" placeholder="Any special requests or notes..." [(ngModel)]="notes"></textarea>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-5">
      <div class="position-sticky" style="top: 20px;">
        <app-cart-summary
          [subtotal]="cartService.subtotal"
          [tax]="cartService.tax"
          [grandTotal]="cartService.grandTotal"
          [itemCount]="cartService.cartCount">
        </app-cart-summary>

        <button class="btn btn-primary w-100 mt-3 btn-lg" (click)="placeOrder()" [disabled]="!customerName || !customerMobile || isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          <i *ngIf="!isLoading" class="bi bi-check-circle me-2"></i>
          Place Order - ₹{{cartService.grandTotal}}
        </button>

        <div *ngIf="!customerName || !customerMobile" class="text-danger small mt-2 text-center">
          <i class="bi bi-exclamation-circle me-1"></i>Please fill in your name and mobile number
        </div>
      </div>
    </div>
  </div>
</div>

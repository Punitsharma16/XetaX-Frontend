<div class="container-fluid px-2 px-sm-3 px-md-4 py-2 py-sm-3 py-md-4">
  <div class="d-flex align-items-center gap-3 mb-3">
    <button class="btn btn-sm btn-light" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
    </button>
    <div>
      <h5 class="mb-0">Schedule Delivery</h5>
      <small class="text-muted">Select items and schedule delivery time</small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-8">
      <h6 class="fw-semibold mb-3 small">Select Food Items</h6>
      <div *ngIf="isLoading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <div *ngIf="!isLoading && menuItems.length === 0" class="empty-state">
        <i class="bi bi-inbox"></i>
        <h5>No items available</h5>
      </div>
      <div *ngIf="!isLoading" class="row g-3">
        <div *ngFor="let item of menuItems" class="col-12 col-sm-6 col-md-4">
          <app-menu-item-card
            [item]="item"
            [quantity]="getSelectedQuantity(item.id)"
            (addToCart)="toggleItem($event)"
            (increment)="toggleItem(item)"
            (decrement)="updateQuantity(item.id, getSelectedQuantity(item.id) - 1)">
          </app-menu-item-card>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-4">
      <div class="position-sticky" style="top: 20px;">
        <div class="card mb-3">
          <div class="card-body p-3">
            <h6 class="fw-semibold mb-3 small">
              <i class="bi bi-clock me-2 text-primary"></i>Delivery Time
            </h6>
            <div class="d-flex flex-column gap-2">
              <div *ngFor="let opt of timeOptions" class="form-check">
                <input class="form-check-input" type="radio" name="deliveryTime" [value]="opt.value" [(ngModel)]="deliveryTime" [id]="'time_' + opt.value">
                <label class="form-check-label small" [for]="'time_' + opt.value">{{opt.label}}</label>
              </div>
              <div *ngIf="deliveryTime === 'custom'" class="mt-2">
                <input type="time" class="form-control" [(ngModel)]="customTime">
              </div>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-body p-3">
            <h6 class="fw-semibold mb-3 small">
              <i class="bi bi-chat-left-text me-2 text-primary"></i>Notes
            </h6>
            <textarea class="form-control" rows="2" placeholder="Any special requests..." [(ngModel)]="notes"></textarea>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-muted small">Selected Items</span>
              <span class="fw-semibold small">{{totalItems}}</span>
            </div>
            <div *ngFor="let s of selectedItems" class="d-flex justify-content-between align-items-center mb-1">
              <small class="text-truncate" style="max-width: 150px;">{{s.item.name}}</small>
              <div class="d-flex align-items-center gap-1">
                <button class="btn btn-sm btn-link text-muted p-0" (click)="updateQuantity(s.item.id, s.quantity - 1)">
                  <i class="bi bi-dash"></i>
                </button>
                <small class="fw-semibold">{{s.quantity}}</small>
                <button class="btn btn-sm btn-link text-muted p-0" (click)="updateQuantity(s.item.id, s.quantity + 1)">
                  <i class="bi bi-plus"></i>
                </button>
              </div>
            </div>
            <hr *ngIf="selectedItems.length > 0">
            <div *ngIf="selectedItems.length > 0" class="d-flex justify-content-between">
              <span class="fw-semibold small">Total</span>
              <span class="fw-bold text-primary">₹{{selectedTotal}}</span>
            </div>
          </div>
        </div>

        <button class="btn btn-primary w-100 btn-lg" (click)="submitSchedule()" [disabled]="selectedItems.length === 0 || submitting">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" role="status"></span>
          <i *ngIf="!submitting" class="bi bi-calendar-check me-2"></i>
          Schedule Delivery
        </button>
      </div>
    </div>
  </div>
</div>

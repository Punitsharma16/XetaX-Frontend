<div class="container-fluid px-2 px-sm-3 px-md-4 py-2 py-sm-3 py-md-4">
  <div class="d-flex align-items-center gap-3 mb-3">
    <button class="btn btn-sm btn-light" (click)="continueShopping()">
      <i class="bi bi-arrow-left"></i>
    </button>
    <div>
      <h5 class="mb-0">Your Cart</h5>
      <small class="text-muted">{{cartItems.length}} items</small>
    </div>
  </div>

  <div *ngIf="cartItems.length === 0" class="empty-state">
    <i class="bi bi-cart-x"></i>
    <h5>Your cart is empty</h5>
    <p>Browse our menu and add items to get started</p>
    <button class="btn btn-primary" (click)="continueShopping()">
      <i class="bi bi-menu-app me-1"></i>View Menu
    </button>
  </div>

  <div *ngIf="cartItems.length > 0" class="row g-3">
    <div class="col-12 col-lg-8">
      <div class="card" *ngFor="let item of cartItems; let i = index">
        <div class="card-body p-3">
          <div class="d-flex gap-3">
            <div class="flex-shrink-0 d-flex align-items-center justify-content-center bg-light rounded-3" style="width: 56px; height: 56px;">
              <i class="bi bi-image text-muted"></i>
            </div>
            <div class="flex-grow-1 min-width-0">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h6 class="mb-0 small fw-semibold">{{item.menuItem.name}}</h6>
                  <small class="text-muted">₹{{item.menuItem.price}} each</small>
                </div>
                <button class="btn btn-sm btn-link text-danger p-0" (click)="removeItem(item.menuItem.id)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
              <div class="d-flex align-items-center justify-content-between mt-2">
                <app-quantity-selector [quantity]="item.quantity" (quantityChange)="updateQuantity(item.menuItem.id, $event)"></app-quantity-selector>
                <span class="fw-semibold small">₹{{item.menuItem.price * item.quantity}}</span>
              </div>
              <div class="mt-2">
                <input type="text" class="form-control" placeholder="Special instructions..." 
                  [value]="item.specialInstructions"
                  (change)="updateInstructions(item.menuItem.id, $any($event.target).value)">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-4">
      <div class="position-sticky" style="top: 20px;">
        <app-cart-summary
          [subtotal]="cartService.subtotal"
          [tax]="cartService.tax"
          [grandTotal]="cartService.grandTotal"
          [itemCount]="cartService.cartCount">
        </app-cart-summary>
        <button class="btn btn-primary w-100 mt-3 btn-lg" (click)="proceedToCheckout()">
          <i class="bi bi-credit-card me-2"></i>Proceed to Checkout
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="cartItems.length > 0 && isMobile" class="fixed-bottom bg-white border-top p-3 shadow-lg">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <div>
        <small class="text-muted">Total</small>
        <h6 class="mb-0 text-primary fw-bold">₹{{cartService.grandTotal}}</h6>
      </div>
      <button class="btn btn-primary btn-lg flex-grow-1 ms-3" (click)="proceedToCheckout()">
        Checkout <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </div>
  </div>
</div>

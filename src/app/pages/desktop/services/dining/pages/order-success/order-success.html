<div class="container-fluid px-2 px-sm-3 px-md-4 py-2 py-sm-3 py-md-4">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="text-center py-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 rounded-4 p-3 mb-3" style="width: 96px; height: 96px;">
          <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
        </div>
        <h4 class="fw-bold mb-1">Order Confirmed!</h4>
        <p class="text-muted small mb-4">Your order has been placed successfully</p>

        <div class="card mb-4">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between mb-3">
              <span class="text-muted small">Order Number</span>
              <span class="fw-bold text-primary">{{order?.id}}</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <span class="text-muted small">Estimated Time</span>
              <span class="fw-semibold">
                <i class="bi bi-clock me-1"></i>{{order?.estimatedTime}} minutes
              </span>
            </div>
            <hr>
            <div class="d-flex justify-content-between">
              <span class="text-muted small">Total Amount</span>
              <span class="fw-bold text-success">₹{{order?.grandTotal}}</span>
            </div>
          </div>
        </div>

        <div class="d-grid gap-3">
          <button class="btn btn-primary btn-lg" (click)="backToMenu()">
            <i class="bi bi-menu-app me-2"></i>Back to Menu
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

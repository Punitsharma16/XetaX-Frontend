<div class="container-fluid px-3 px-md-4 py-4 py-md-5">
  <div class="text-center mb-5">
    <div class="d-inline-flex align-items-center justify-content-center rounded-4 mb-3" style="width: 72px; height: 72px; background: rgba(245, 158, 11, 0.1);">
      <i class="bi bi-shop" style="font-size: 2rem; color: #f59e0b;"></i>
    </div>
    <h3 class="fw-bold mb-2">Welcome to Dining Service</h3>
    <p class="text-muted mb-0 mx-auto" style="max-width: 500px;">Select your dining experience to browse menus, place orders, and enjoy seamless service.</p>
  </div>

  <div class="row g-4 justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5" *ngFor="let service of services">
      <div class="card service-card border-0 h-100" (click)="navigateTo(service.route)" role="button">
        <div class="card-body p-4 p-sm-5 text-center">
          <div class="service-icon d-inline-flex align-items-center justify-content-center rounded-4 mb-4"
            [style.background]="service.type === 'table' ? 'rgba(59, 130, 246, 0.1)' : 'rgba(139, 92, 246, 0.1)'"
            [style.color]="service.color"
            style="width: 72px; height: 72px;">
            <i class="bi" [ngClass]="service.icon" style="font-size: 2rem;"></i>
          </div>
          <h4 class="fw-bold mb-2">{{ service.title }}</h4>
          <p class="text-muted mb-4">{{ service.description }}</p>
          <span class="btn btn-sm px-4 py-2 rounded-pill" [style.background]="service.color" style="color: #fff; border: none;">
            Get Started
            <i class="bi bi-arrow-right ms-1"></i>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
